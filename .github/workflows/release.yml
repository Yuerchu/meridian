name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test-${{ matrix.label }}
          # `sherpa-onnx-sys` unpacks its prebuilt libraries here and returns early
          # if the directory exists. Without this the cache restores the build
          # script's fingerprint but not its output: the script never re-runs, the
          # libraries are never re-downloaded, and the linker is handed a `-L` for a
          # path that is gone.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      - name: TypeScript check
        run: pnpm exec tsc -b

      - name: Frontend tests
        run: pnpm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: build-${{ matrix.target }}
          # `sherpa-onnx-sys` unpacks its prebuilt libraries here and returns early
          # if the directory exists. Without this the cache restores the build
          # script's fingerprint but not its output: the script never re-runs, the
          # libraries are never re-downloaded, and the linker is handed a `-L` for a
          # path that is gone.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Meridian ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          tauriScript: pnpm tauri

  build-android:
    # needs `build` too: the desktop job creates the GitHub release this job
    # uploads into; running in parallel raced against its creation.
    needs: [test, build]
    runs-on: ubuntu-latest
    name: Build (android-aarch64)

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: build-android-aarch64

      - run: pnpm install

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned/debug-signed release APK" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang++
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang
          pnpm tauri android build --target aarch64 --apk

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          VERSION=${{ github.ref_name }}
          gh release upload "$VERSION" "$APK#Meridian_${VERSION#v}_aarch64.apk" --clobber
