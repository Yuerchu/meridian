name: Release

on:
  push:
    tags: ['v*']
  # For finishing a release the tag push left incomplete. A macOS minute bills
  # at ten and a Windows one at two, so rebuilding three platforms to recover
  # one is most of an hour of quota for a few files.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload into
        required: true
      only:
        description: Restrict the desktop build to one platform
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-arm64, none]
      android:
        description: Build the Android APK
        type: boolean
        default: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Plan
    outputs:
      desktop: ${{ steps.pick.outputs.desktop }}
      any-desktop: ${{ steps.pick.outputs.any-desktop }}
    steps:
      - id: pick
        shell: bash
        env:
          # Empty on a tag push, where every platform is wanted.
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          win='{"os":"windows-latest","target":"x86_64-pc-windows-msvc","label":"windows-x64"}'
          mac='{"os":"macos-latest","target":"aarch64-apple-darwin","label":"macos-arm64"}'
          lin='{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","label":"linux-x64"}'
          # Spelled out rather than filtered with jq: the whole point of this
          # job is to not spend a build finding out that a one-line expression
          # was wrong, and the choice input already bounds the input.
          #
          # `all` leaves macOS out. Its bundle links sherpa-onnx dynamically
          # and ships none of it, so it builds cleanly into something that
          # cannot start — see the Packaging section in CLAUDE.md. Still
          # selectable by name, for working on exactly that.
          case "${ONLY:-all}" in
            ''|all)      picked="[$win,$lin]" ;;
            windows-x64) picked="[$win]" ;;
            macos-arm64) picked="[$mac]" ;;
            linux-x64)   picked="[$lin]" ;;
            none)        picked='[]' ;;
            *) echo "unknown platform: $ONLY" >&2; exit 1 ;;
          esac
          echo "desktop=$picked" >> "$GITHUB_OUTPUT"
          # An empty matrix is an error rather than an empty set, so the jobs
          # that would consume one are gated on this instead.
          if [ "$picked" = '[]' ]; then
            echo "any-desktop=false" >> "$GITHUB_OUTPUT"
          else
            echo "any-desktop=true" >> "$GITHUB_OUTPUT"
          fi
          echo "building: $picked"

  test:
    needs: plan
    if: needs.plan.outputs.any-desktop == 'true'
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rust-toolchain.toml names the version; see ci.yml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test-${{ matrix.label }}
          # `sherpa-onnx-sys` unpacks its prebuilt libraries here and returns early
          # if the directory exists. Without this the cache restores the build
          # script's fingerprint but not its output: the script never re-runs, the
          # libraries are never re-downloaded, and the linker is handed a `-L` for a
          # path that is gone.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Free runner disk
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/share/swift /usr/local/graalvm /usr/local/julia* \
            /usr/local/lib/heroku /usr/local/aws-cli /opt/microsoft/powershell
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      - name: TypeScript check
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Drop a half-restored sherpa-onnx unpack
        shell: bash
        run: bash .github/scripts/require-sherpa-libs.sh

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    needs: [plan, test]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # rust-toolchain.toml names the version; see ci.yml. Windows adds the
      # 32-bit target for the input method's TSF DLL: 32-bit apps load a
      # 32-bit text service, and Tauri's own build has one target. See the
      # Packaging section in CLAUDE.md.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }} ${{ matrix.os == 'windows-latest' && 'i686-pc-windows-msvc' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: build-${{ matrix.target }}
          # Beside the triple, not under it: sherpa-onnx-sys puts its cache in
          # the nearest ancestor of OUT_DIR named `target`, which `--target`
          # does not move. The guard step below covers a miss either way, but
          # only by re-downloading.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Free runner disk
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/share/swift /usr/local/graalvm /usr/local/julia* \
            /usr/local/lib/heroku /usr/local/aws-cli /opt/microsoft/powershell
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      # The fonts are not in git (MiSans may not be redistributed on its own), so
      # `pnpm build` fetches them through its `prebuild` hook. Run here as well so
      # a download or hash failure is its own named step rather than a line deep in
      # the Tauri build's output, and cached by the script that pins the hashes:
      # ~450 MB of archives that only change when a pin does.
      - name: Cache bundled font archives
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Fetch bundled fonts
        run: pnpm fonts

      - name: Drop a half-restored sherpa-onnx unpack
        shell: bash
        run: bash .github/scripts/require-sherpa-libs.sh

      # The input method is two workspace members the app does not depend on,
      # built before the app so `build.rs` can stage them under
      # `resources/ime/`. Its own target directory under the cached one: the
      # MSI bundler ships every `*.dll` beside the main binary, so an
      # unversioned copy in the app's directory would be packaged a second
      # time. The x86 DLL is the one thing here Tauri's build cannot produce:
      # a second target in the same run.
      - name: Build IME (x64)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo build --release --target-dir target/ime --target ${{ matrix.target }} -p meridian-ime-tsf -p meridian-ime-host

      - name: Build IME TSF (x86)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo build --release --target-dir target/ime --target i686-pc-windows-msvc -p meridian-ime-tsf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Turns a missing input method artifact from a build-script warning
          # into a failure, so a Windows installer without it cannot be
          # released by accident. Empty elsewhere, where there is none.
          MERIDIAN_IME_REQUIRED: ${{ matrix.os == 'windows-latest' && '1' || '' }}
          # linuxdeploy resolves the binary's dependencies against the copy it
          # has already placed in the AppDir, where `$ORIGIN` — the rpath
          # sherpa-onnx-sys emits — points at a directory holding only the
          # binary. It therefore cannot see `libsherpa-onnx-c-api.so`, which
          # sits beside the *original* binary, and refuses to build the image.
          # Naming that directory lets it find the library and copy it in, which
          # is what makes the AppImage self-contained. Cargo writes there long
          # before the bundling step, and a path that does not exist yet is
          # simply skipped.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Meridian ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          # `--verbose` on Linux only, and not for the extra logging: the
          # bundler runs linuxdeploy with `.output()` and discards what it
          # captured whenever the log level is Error, which is the default. A
          # failure there arrives as the bare string "failed to run
          # linuxdeploy" with the reason thrown away. Any other level takes the
          # branch that reports it (`linuxdeploy.rs`, `run_appimage_bundler`).
          #
          # `--config src-tauri/tauri.ime.conf.json` on Windows only: it adds
          # the input method's resources and NSIS hooks and switches the
          # installer to perMachine, which the TSF registration needs. Linux
          # is unchanged.
          args: --target ${{ matrix.target }}${{ matrix.os == 'ubuntu-latest' && ' --verbose' || '' }}${{ matrix.os == 'windows-latest' && ' --config src-tauri/tauri.ime.conf.json' || '' }}
          # The demo-fixture check on `dist/` is not a step here: it is the
          # last command of `pnpm build`, which is `beforeBuildCommand`, so a
          # contaminated bundle fails the build before anything is packaged
          # or uploaded to the draft.
          tauriScript: pnpm tauri

  build-android:
    # needs `build` too: the desktop job creates the GitHub release this job
    # uploads into; running in parallel raced against its creation. `always()`
    # keeps that ordering without inheriting the skip when there is no desktop
    # build to wait for — the release already exists in that case.
    needs: [plan, test, build]
    if: |
      always()
      && inputs.android != false
      && needs.test.result != 'failure'
      && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    name: Build (android-aarch64)

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: build-android-aarch64
          # sherpa-onnx-sys downloads the Android libraries itself (from
          # 1.13.8) and unpacks them here, whatever the --target.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Drop a half-restored sherpa-onnx unpack
        run: bash .github/scripts/require-sherpa-libs.sh

      - run: pnpm install

      # The fonts are not in git (MiSans may not be redistributed on its own), so
      # `pnpm build` fetches them through its `prebuild` hook. Run here as well so
      # a download or hash failure is its own named step rather than a line deep in
      # the Tauri build's output, and cached by the script that pins the hashes:
      # ~450 MB of archives that only change when a pin does.
      - name: Cache bundled font archives
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Fetch bundled fonts
        run: pnpm fonts

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned/debug-signed release APK" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          # No SHERPA_ONNX_LIB_DIR: from 1.13.8 sherpa-onnx-sys downloads the
          # Android libraries itself and copies them into the app's
          # src/main/jniLibs, where gradle packages them.
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang++
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang
          # `tauri.android.conf.json` does not override `beforeBuildCommand`,
          # so this runs `pnpm build` too — and with it the demo-fixture check,
          # before gradle packages `dist/` into the APK.
          pnpm tauri android build --target aarch64 --apk

      - name: Upload APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -1)
          VERSION=${{ inputs.tag || github.ref_name }}
          gh release upload "$VERSION" "$APK#Meridian_${VERSION#v}_aarch64.apk" --clobber
