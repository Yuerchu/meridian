name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual runs exist for the visual job: `update_visual_baselines` regenerates
  # the Linux screenshots and uploads them as an artifact to be committed. A
  # dispatch with it set runs the visual job alone — every other job carries an
  # `if:` that skips it, since none of them bears on the pixels.
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Regenerate the Linux visual baselines and upload them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skipped when dispatched only to regenerate the visual baselines; see `visual`.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines) }}
    strategy:
      fail-fast: false
      # No macOS. A macOS minute bills at ten, and it was buying coverage of a
      # platform this project does not ship: the bundle links sherpa-onnx
      # dynamically and carries none of it, so it builds cleanly into something
      # that cannot start — see the Packaging section in CLAUDE.md. Release
      # still has it behind an explicit choice, for working on exactly that.
      #
      # Linux stays. It bills at one, it is the only place the Rust tests run
      # off Windows, and it is the AppImage's platform.
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4
        with:
          # src-tauri/crates is the meridian-core submodule; without it every
          # `meridian_core::` import is unresolved.
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs what rust-toolchain.toml names, clippy and rustfmt included,
      # so the version lives in one place. A floating `stable` here let a new
      # release's clippy fail code nobody had touched.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # The input method's TSF DLL ships as x86 too (32-bit apps load a
      # 32-bit text service), and nothing else in CI compiles for it.
      - name: Add the 32-bit target
        if: matrix.os == 'windows-latest'
        run: rustup target add i686-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test-${{ matrix.label }}
          # `sherpa-onnx-sys` unpacks its prebuilt libraries here and returns early
          # if the directory exists. Without this the cache restores the build
          # script's fingerprint but not its output: the script never re-runs, the
          # libraries are never re-downloaded, and the linker is handed a `-L` for a
          # path that is gone.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      # The shell's debug build is ~500 crates of tauri and webkit, and the
      # core's own test build recompiles another ~120 under its own feature
      # set. Together they overran the 14 GB the runner leaves free — the
      # linker died with SIGBUS and `No space left on device` — the first time
      # the Linux leg got this far. The runner image carries toolchains this
      # job never touches; dropping them frees ~25 GB.
      - name: Free runner disk
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/share/swift /usr/local/graalvm /usr/local/julia* \
            /usr/local/lib/heroku /usr/local/aws-cli /opt/microsoft/powershell
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      # Style gates run on the Linux leg only: they are platform-independent,
      # and a Windows minute costs twice a Linux one.
      - name: Prettier check
        if: matrix.os == 'ubuntu-latest'
        run: pnpm format:check

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      # The local rules and selectors that ESLint runs above are themselves
      # pinned to fixtures; a selector that stops matching is invisible to
      # `pnpm lint` and only this step notices.
      - name: Lint rule fixtures
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint:rules

      - name: No invented domain defaults (core)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-rust-invented-default.mjs src-tauri/crates/core/src

      # The shell and the core are two workspaces — `src-tauri/crates` is the
      # meridian-core submodule, excluded from the shell's workspace — so every
      # cargo gate runs twice. The core's runs share `src-tauri/target` through
      # `--target-dir`, which is what keeps the second from rebuilding the
      # dependency tree the first already built.
      - name: rustfmt check
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: rustfmt check (core)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri/crates
        run: cargo fmt --all --check

      - name: Frontend tests
        run: pnpm test

      - name: Drop a half-restored sherpa-onnx unpack
        shell: bash
        run: bash .github/scripts/require-sherpa-libs.sh

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (core)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri/crates
        run: cargo clippy --workspace --all-targets --target-dir ../target -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # The one target the release build uses that nothing above compiles
      # for. A check rather than a build: the DLL's 32-bit linkage is what
      # can rot unnoticed, and it is the same source as the x64 one.
      - name: Check IME TSF (x86)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri
        run: cargo check -p meridian-ime-tsf --target i686-pc-windows-msvc

      - name: Rust tests (core)
        working-directory: src-tauri/crates
        run: cargo test --workspace --target-dir ../target

  android-check:
    # Skipped when dispatched only to regenerate the visual baselines; see `visual`.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines) }}
    runs-on: ubuntu-latest
    name: Check (android-aarch64)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: check-android-aarch64
          # sherpa-onnx-sys downloads the Android libraries itself (from
          # 1.13.8) and unpacks them here, whatever the --target.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Drop a half-restored sherpa-onnx unpack
        run: bash .github/scripts/require-sherpa-libs.sh

      - name: Cargo check for Android
        working-directory: src-tauri
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang++
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang
          cargo check --target aarch64-linux-android
          # The keyboard engine is a separate library the root package does not
          # depend on, so the line above never compiles its JNI entry points.
          cargo clippy --target aarch64-linux-android -p meridian-ime-android -- -D warnings

  # The web bundle a release ships, built and inspected on its own: nothing in
  # `test` runs `vite build`, and the one guard keeping the dev fixture backend
  # (`src/dev/demo/`) out of it is an `import.meta.env.DEV` condition in
  # `src/lib/transport.ts` that no test can see fold away.
  frontend-build:
    # Skipped when dispatched only to regenerate the visual baselines; see `visual`.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines) }}
    runs-on: ubuntu-latest
    name: Build (web bundle)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      # Same cache as release.yml: the fonts are not in git and the bundle
      # imports them.
      - name: Cache bundled font archives
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      - name: Fetch bundled fonts
        run: pnpm fonts

      # The same command Tauri's `beforeBuildCommand` runs, so this builds the
      # exact bundle a release packages — and ends, as that one does, with
      # `check-dist-no-demo`, which fails the build if fixture strings leaked.
      - name: Build (tsc, vite, no demo fixtures)
        run: pnpm build

      # Nothing else in CI runs the Tauri CLI, which refuses to build when an
      # npm package and its Rust crate differ in major.minor. Reads both lock
      # files; no install or build needed.
      - name: Tauri npm packages match their crates
        run: pnpm tauri:versions

      # The Rust half of the lint gate `no-default-on-load-failure`: a command
      # that reads and defaults on failure, then writes back. Needs no toolchain.
      - name: No read-then-default in commands
        run: node scripts/check-rust-read-default.mjs

      # The Rust half of `no-invented-domain-default`: a window, a price, a
      # limit or a size that is unknown stays `None` rather than becoming a
      # number nobody configured. The core's half runs in `test`, which is
      # the job that checks the submodule out.
      - name: No invented domain defaults (shell)
        run: node scripts/check-rust-invented-default.mjs

  # Screenshot regression over the dev demo backend (see "Development" in
  # CLAUDE.md). Linux compares only against Linux baselines: font
  # rasterisation differs between platforms, so e2e/__screenshots__/ keeps one
  # directory per platform and this job owns `linux/`.
  #
  # With no `linux/` directory yet, or when dispatched with
  # `update_visual_baselines`, the job writes the baselines instead of
  # comparing and uploads them as the `visual-baselines-linux` artifact —
  # unzip it into e2e/__screenshots__/linux/ and commit.
  visual:
    runs-on: ubuntu-latest
    name: Visual (linux-x64)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Cache bundled font archives
        uses: actions/cache@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.mjs') }}

      # Without them the page falls back to system fonts and every screenshot
      # is wrong, which is why the script fails rather than degrading.
      - name: Fetch bundled fonts
        run: pnpm fonts

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser is cached by version; the system libraries it needs are
      # not (they live in apt), so those are installed on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Stickers and some fixtures draw emoji; the runner image has no colour
      # emoji font and would render them as boxes.
      - name: Install colour emoji font
        run: sudo apt-get install -y fonts-noto-color-emoji

      - name: Decide compare or update
        id: mode
        run: |
          if [ "${{ inputs.update_visual_baselines }}" = "true" ] || [ ! -d e2e/__screenshots__/linux ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Writing Linux visual baselines instead of comparing; commit the visual-baselines-linux artifact."
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Visual regression
        if: steps.mode.outputs.update != 'true'
        run: pnpm test:visual

      - name: Write visual baselines
        if: steps.mode.outputs.update == 'true'
        run: pnpm exec playwright test --update-snapshots=all

      - name: Upload Linux baselines
        if: steps.mode.outputs.update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/__screenshots__/linux/
          if-no-files-found: error

      # Expected, actual and diff images for every failing scene, plus traces.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
