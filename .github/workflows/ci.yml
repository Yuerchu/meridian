name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      # No macOS. A macOS minute bills at ten, and it was buying coverage of a
      # platform this project does not ship: the bundle links sherpa-onnx
      # dynamically and carries none of it, so it builds cleanly into something
      # that cannot start — see the Packaging section in CLAUDE.md. Release
      # still has it behind an explicit choice, for working on exactly that.
      #
      # Linux stays. It bills at one, it is the only place the Rust tests run
      # off Windows, and it is the AppImage's platform.
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64

    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The action installs a minimal profile; the style gates below need
          # both components.
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: test-${{ matrix.label }}
          # `sherpa-onnx-sys` unpacks its prebuilt libraries here and returns early
          # if the directory exists. Without this the cache restores the build
          # script's fingerprint but not its output: the script never re-runs, the
          # libraries are never re-downloaded, and the linker is handed a `-L` for a
          # path that is gone.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - run: pnpm install

      - name: TypeScript check
        run: pnpm typecheck

      # Style gates run on the Linux leg only: they are platform-independent,
      # and a Windows minute costs twice a Linux one.
      - name: ESLint
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint

      - name: Prettier check
        if: matrix.os == 'ubuntu-latest'
        run: pnpm format:check

      - name: rustfmt check
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Frontend tests
        run: pnpm test

      - name: Drop a half-restored sherpa-onnx unpack
        shell: bash
        run: bash .github/scripts/require-sherpa-libs.sh

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  android-check:
    runs-on: ubuntu-latest
    name: Check (android-aarch64)

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: check-android-aarch64

      - name: Cache the sherpa-onnx Android libraries
        uses: actions/cache@v4
        with:
          path: src-tauri/target/sherpa-onnx-android
          key: sherpa-android-${{ hashFiles('src-tauri/crates/core/Cargo.toml') }}

      - name: Fetch the sherpa-onnx Android libraries
        run: bash scripts/fetch-sherpa-android.sh arm64-v8a

      - name: Cargo check for Android
        working-directory: src-tauri
        run: |
          NDK=$ANDROID_NDK_LATEST_HOME
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          # Required on Android, where sherpa-onnx-sys cannot download its own.
          export SHERPA_ONNX_LIB_DIR=$GITHUB_WORKSPACE/src-tauri/target/sherpa-onnx-android/jniLibs/arm64-v8a
          export CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android34-clang++
          export AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android34-clang
          cargo check --target aarch64-linux-android
