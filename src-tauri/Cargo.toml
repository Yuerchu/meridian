[workspace]
members = [".", "crates/sandbox-types", "crates/sandbox-windows"]

[package]
name = "meridian"
version = "0.1.3"
edition = "2024"
license = "LicenseRef-Proprietary-Yuerchu"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]

[lib]
name = "meridian_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "meridian"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls-webpki-roots"], default-features = false }
eventsource-stream = "0.2"
futures = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"
# env-filter is the only addition: registry and reload already arrive with the
# default features, and the JSONL formatting is ours rather than `json`'s.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Ported from Codex (Apache-2.0)
keyring = { version = "3.6", default-features = false, features = ["crypto-rust"] }
age = "0.11"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
regex = "1"
mime_guess = "2"
bytes = "1"
http = "1"
async-trait = "0.1"
ignore = "0.4"
glob = "0.3"
# OneBot WebSocket server (desktop only)
tokio-tungstenite = "0.26"
percent-encoding = "2"
# Database
diesel = { version = "2", features = ["sqlite", "r2d2"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
diesel_migrations = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
similar = "2"
strum = { version = "0.27", features = ["derive"] }
dirs = "6"
tiktoken = "3.5"
tauri-plugin-notification = "2"

# Offline voice input (desktop only; Android will reuse engine.rs with
# SHERPA_ONNX_LIB_DIR pointing at the prebuilt android .so — see memory notes)
[target.'cfg(not(target_os = "android"))'.dependencies]
sherpa-onnx = { version = "1.13.4", default-features = false, features = ["shared"] }
cpal = "0.15"
tar = "0.4"
bzip2 = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "windows-native"] }
sandbox-windows = { path = "crates/sandbox-windows" }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemServices", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "apple-native"] }
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "linux-native-async-persistent"] }

[target.'cfg(target_os = "android")'.dependencies]
android-keyring = { version = "0.2", features = ["ndk-context"] }
jni = "0.21"
ndk-context = "0.1"

# Process-group termination for command execution (sandbox.rs)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tempfile = "3"
pretty_assertions = "1"
