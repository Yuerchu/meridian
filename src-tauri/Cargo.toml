[workspace]
# `ime/*` is the input method: the engine, the wire protocol, the TSF text
# service and its host process. They live in the shell workspace rather than
# in the core submodule because a headless server or `meridiand` must not
# carry an input method, and they are listed one by one because the root
# package deliberately depends on none of them — the Android check never
# compiles them, and the desktop build only stages the artifacts they produce.
members = [
    ".",
    "ime/dict",
    "ime/engine",
    "ime/proto",
    "ime/session",
    "ime/config",
    "ime/cli",
    "ime/tsf",
    "ime/host",
]
# `crates/` is the meridian-core submodule (github.com/Yuerchu/meridian-core)
# and a workspace of its own. A package may belong to one workspace only, so
# the directory is excluded here and its crates are reached by path — which
# cargo allows across a workspace boundary as long as nothing in there uses
# `key.workspace = true` inheritance (it would be resolved against *this*
# manifest when the shell builds).
#
# The shell alone is not the app: everything with a test in it lives in
# `meridian-core`, and a bare `cargo test` here runs the shell's twenty-two
# tests only. The core's own suite runs from `crates/`
# (`cargo test --workspace --target-dir ../target`), which is what CI does.
exclude = ["crates"]

[package]
name = "meridian"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]

[lib]
name = "meridian_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "meridian"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meridian-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
diesel = { version = "2", features = ["sqlite", "r2d2"] }
url = "2"
# Not used from Rust. `build.rs` stages the runtime libraries this crate's
# build script unpacks, and cargo orders one build script after another only
# for a *direct* dependency carrying a `links` key — through `meridian-core`
# and `sherpa-onnx` the two ran concurrently, and on a runner whose cache had
# dropped the archive ours lost the race and panicked over DLLs that were
# seconds from existing. Measured with a three-crate probe: transitive, the
# marker was never seen; direct, it always was. Same version and features as
# `meridian-core` declares, so this adds no second copy.
sherpa-onnx-sys = { version = "1.13.8", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "android")'.dependencies]
android-keyring = { version = "0.2", features = ["ndk-context"] }
jni = "0.21"
ndk-context = "0.1"

# Remote access: the desktop is the server and a phone is the client, so this
# whole surface is absent on Android.
#
# axum rather than the bare hyper the hook endpoint uses. That choice was argued
# in this file on the grounds that two routes did not justify pulling in a
# router; this is six routes, a websocket upgrade, multipart, streamed files and
# a CORS preflight, and writing those by hand costs more than the dependency.
# The hook endpoint stays on hyper: migrating it buys nothing and would put a
# working gate in the blast radius.
[target.'cfg(not(target_os = "android"))'.dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
# For `WebSocket::split`: reading and writing one socket concurrently.
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# `test_db` is behind a feature rather than `cfg(test)`: the shell's tests are a
# different crate, so the core's own test configuration is invisible to them.
meridian-core = { path = "crates/core", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

# The input method: Meridian's side of it is a settings page, an importer and
# a control client for the host process. The engine, the DLL and the host are
# workspace members of their own (`ime/`), built and shipped separately; the
# shell only depends on the contract crates.
[target.'cfg(windows)'.dependencies]
meridian-ime-config = { path = "ime/config" }
meridian-ime-dict = { path = "ime/dict" }
meridian-ime-proto = { path = "ime/proto" }
windows-registry = "0.6"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
