[workspace]
members = [".", "crates/core", "crates/sandbox-types", "crates/sandbox-windows"]
# The shell alone is not the app: everything with a test in it lives in
# `meridian-core`, so a bare `cargo test` or `cargo check` that stopped at the
# root package would run twenty-two tests and report a green tree.
default-members = [".", "crates/core"]

[package]
name = "meridian"
version = "0.2.0"
edition = "2024"
license = "LicenseRef-Proprietary-Yuerchu"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]

[lib]
name = "meridian_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
# Tauri command signatures mirror their IPC payloads; bundling arguments into
# structs would decouple the handler from what the frontend actually sends.
too_many_arguments = "allow"

[[bin]]
name = "meridian"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meridian-core = { path = "crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
diesel = { version = "2", features = ["sqlite", "r2d2"] }

[target.'cfg(target_os = "android")'.dependencies]
android-keyring = { version = "0.2", features = ["ndk-context"] }
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
# `test_db` is behind a feature rather than `cfg(test)`: the shell's tests are a
# different crate, so the core's own test configuration is invisible to them.
meridian-core = { path = "crates/core", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
