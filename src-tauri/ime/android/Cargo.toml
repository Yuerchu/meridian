[package]
name = "meridian-ime-android"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]
description = "Meridian 输入法的 Android 端：键盘进程内的引擎与 JNI 接口"

# `libmeridian_ime.so`, loaded by the keyboard service in the `:ime` process.
# It is built by its own cargo invocation (scripts/build-ime-android.sh), not
# by Tauri's build, because the app's library must not carry an input method
# and the keyboard's process must not load the app. `rlib` as well so the
# host logic is tested on the desktop.
[lib]
name = "meridian_ime"
crate-type = ["cdylib", "rlib"]

[dependencies]
meridian-ime-config = { path = "../config" }
meridian-ime-dict = { path = "../dict" }
meridian-ime-engine = { path = "../engine" }
meridian-ime-host = { path = "../host" }
meridian-ime-lm = { path = "../lm" }
meridian-ime-proto = { path = "../proto" }
meridian-ime-session = { path = "../session" }
serde = "1"
serde_json = "1"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
