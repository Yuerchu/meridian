[package]
name = "meridian-ime-tsf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]
description = "Meridian 输入法的 TSF 文本服务（进入每个应用进程的 DLL；不含引擎）"

[lib]
name = "meridian_ime_tsf"
crate-type = ["cdylib", "rlib"]

[lints.clippy]
# Every entry point here is a COM callback or a Win32 call whose contract is
# Microsoft's, not ours; a `# Safety` section per method would restate the
# TSF documentation. The unsafe blocks carry `// SAFETY:` notes instead.
missing_safety_doc = "allow"
# COM interface methods take raw pointers by the interface definition and cannot
# be marked `unsafe`; the dereferences are inside `unsafe` blocks with notes.
not_unsafe_ptr_arg_deref = "allow"

[dependencies]
meridian-ime-proto = { path = "../proto" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-registry = "0.6"
