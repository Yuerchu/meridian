[package]
name = "meridian-ime-dict"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["于小丘 Yuerchu <admin@yuxiaoqiu.cn>"]
description = "Meridian 输入法的词典格式、多词典合并查询与 Rime 词库导入器"

[dependencies]
fst = "0.4"
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
