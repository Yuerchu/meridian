# One compiler for every machine and every CI job. Floating `stable` let a new
# release's clippy turn CI red on code nobody had touched, while a local run on
# an older stable passed. Upgrading is a change of its own: bump this, fix what
# the new clippy reports, in one commit. src-tauri/crates (meridian-core) pins
# the same version in its own rust-toolchain.toml; keep the two in step.
#
# Extra targets are not listed here, or every job would download them. A local
# Android or 32-bit input-method build adds its own once:
#   rustup target add aarch64-linux-android i686-pc-windows-msvc
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
