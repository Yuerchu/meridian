<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` because this is an application, not a page: pinching
         it scales the chrome away from the edges it is anchored to, and the
         safe-area insets are computed against a viewport that is no longer the
         screen. Text size is a setting, not a gesture. `maximum-scale` is there
         for the WebViews that ignore the former and honour the latter. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Meridian</title>
    <!-- Settles the theme before anything paints. React cannot: the preference
         lives in localStorage precisely because it has to be readable
         synchronously, where a Tauri `get_preference` round-trip is not.
         The key and the media query are the ones `src/lib/theme.tsx` uses,
         and it narrows a junk value the same way — diverge here and the two
         fight over `<html>`. `dark` is the only class anything reads
         (`@custom-variant dark` in globals.css); light is its absence.

         The key was `heroui-theme` until 2026-09; the one-time read below
         carries a stored choice across the rename and then forgets the old key. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('meridian-theme')
          if (stored === null) {
            var legacy = localStorage.getItem('heroui-theme')
            if (legacy !== null) {
              localStorage.setItem('meridian-theme', legacy)
              localStorage.removeItem('heroui-theme')
              stored = legacy
            }
          }
          if (stored !== 'light' && stored !== 'dark') stored = 'system'
          var resolved =
            stored === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : stored
          document.documentElement.classList.toggle('dark', resolved === 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <!-- Painted before the stylesheet arrives, so the window does not flash the
         wrong colour on the way to the app. Both values are boardui's
         `--color-background-full` (styles/theme.css) — white light, neutral-925
         dark — and both have to be changed with it. The window's own colour is
         set in tauri.conf.json for the frame before that. -->
    <style>
      html {
        background-color: #ffffff;
      }
      html.dark {
        background-color: #121212;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
