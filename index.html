<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no` because this is an application, not a page: pinching
         it scales the chrome away from the edges it is anchored to, and the
         safe-area insets are computed against a viewport that is no longer the
         screen. Text size is a setting, not a gesture. `maximum-scale` is there
         for the WebViews that ignore the former and honour the latter. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Meridian</title>
    <!-- Settles the theme before anything paints. React cannot: the preference
         lives in localStorage precisely because it has to be readable
         synchronously, where a Tauri `get_preference` round-trip is not.
         The key and the media query are the ones `useTheme` (@heroui/react)
         uses, and `src/lib/theme.tsx` narrows a junk value the same way —
         diverge here and the two fight over `<html>`. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('heroui-theme');
          if (stored !== 'light' && stored !== 'dark') stored = 'system';
          var resolved = stored === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : stored;
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(resolved);
          root.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Painted before the stylesheet arrives, so the window does not flash the
         wrong colour on the way to the app. Both values are `--background` from
         index.css — oklch(0.97 0 0) light, oklch(0.145 0 0) dark — and both have
         to be changed with it. The window's own colour is set in
         tauri.conf.json for the frame before that. -->
    <style>
      html { background-color: #f5f5f5; }
      html.dark { background-color: #0a0a0a; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
